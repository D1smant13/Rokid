name: Build FactCheck HUD APK

on:
  push:
    branches:
      - factcheck-apk-port-20260910
    paths:
      - "factcheck-apk/**"
      - ".github/workflows/factcheck-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Build signed FactCheck HUD APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore permanent Android signing key
        shell: bash
        env:
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${SIGNING_KEY_PASSPHRASE:-}" ]; then
            echo "Missing repository secret: SIGNING_KEY_PASSPHRASE"
            exit 1
          fi

          KEYSTORE="${RUNNER_TEMP}/rokid-release.jks"

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "${SIGNING_KEY_PASSPHRASE}" \
            --output "${KEYSTORE}" \
            --decrypt signing/rokid-release.jks.gpg

          keytool -list \
            -keystore "${KEYSTORE}" \
            -storepass "${SIGNING_KEY_PASSPHRASE}" \
            -alias rokid-release \
            >/dev/null

          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=rokid-release" >> "${GITHUB_ENV}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          gradle -p factcheck-apk :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="factcheck-apk/app/build/outputs/apk/release/app-release.apk"
          TARGET="FactCheck-HUD-Rokid.apk"

          test -f "${SOURCE}"
          cp "${SOURCE}" "${TARGET}"

          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "${TARGET}" \
            | tee FactCheck-HUD-signature.txt

          ls -lh "${TARGET}"

      - name: Upload FactCheck HUD APK
        uses: actions/upload-artifact@v4
        with:
          name: FactCheck-HUD-Rokid-APK
          path: FactCheck-HUD-Rokid.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload signature report
        uses: actions/upload-artifact@v4
        with:
          name: FactCheck-HUD-Signature
          path: FactCheck-HUD-signature.txt
          if-no-files-found: error
          retention-days: 30
