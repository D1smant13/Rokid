plugins {
    id 'com.android.application'
}

android {
    namespace 'com.damage.factcheckhud'
    compileSdk 34

    signingConfigs {
        permanent {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'rokid-release'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.damage.factcheckhud'
        minSdk 28
        targetSdk 34
        versionCode 100
        versionName '1.0.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.permanent
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
